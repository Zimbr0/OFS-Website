name: Deploy to GitHub Pages

# Baut zwei Branches (zwei Designs) und veröffentlicht beide gemeinsam auf
# derselben GitHub-Pages-Seite unter zwei Pfaden:
#   - claude/school-project-design-aotieh  -> /OFS-Website/
#   - claude/school-project-design-v2      -> /OFS-Website/v2/
# Ein Push auf einen der beiden Branches baut beide neu, damit die Seite nie
# nur zur Hälfte aktuell ist.

on:
  push:
    branches:
      - claude/school-project-design-aotieh
      - claude/school-project-design-v2
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Design 1 (aotieh)
        uses: actions/checkout@v4
        with:
          ref: claude/school-project-design-aotieh
          path: site-v1

      - name: Checkout Design 2 (v2)
        uses: actions/checkout@v4
        with:
          ref: claude/school-project-design-v2
          path: site-v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            site-v1/package-lock.json
            site-v2/package-lock.json

      - name: Build Design 1
        working-directory: site-v1
        run: |
          npm ci
          npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Build Design 2
        working-directory: site-v2
        run: |
          npm ci
          npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Combine outputs
        run: |
          mkdir -p combined
          cp -r site-v1/out/. combined/
          mkdir -p combined/v2
          cp -r site-v2/out/. combined/v2/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./combined

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
