name: Deploy to GitHub Pages

# Dieser Branch (aotieh) wird nicht mehr veröffentlicht. Das aktuelle Design
# lebt auf claude/school-project-design-v2 und baut/deployt sich von dort
# direkt nach /OFS-Website/. Diese Datei hier bleibt bewusst inaktiv (keine
# aotieh-Trigger, kein Build-Job mehr), damit ein Push auf aotieh nie wieder
# versehentlich den v2-Stand auf GitHub Pages überschreibt.
#
# Maßgeblich ist ausschließlich die Workflow-Datei auf dem Branch, der den
# Push auslöst - ein alter, hier weiter vorhandener aotieh-Trigger würde also
# trotzdem wieder feuern, wäre er nicht entfernt worden.

on:
  push:
    branches:
      - claude/school-project-design-v2
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build
        env:
          GITHUB_PAGES: "true"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
